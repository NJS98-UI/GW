<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>冥城应用商店 — 车机应用平台</title>

<style>
:root{
  --bg:#0a0a0f;--bg2:#0f0f17;--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.06);
  --ink:#f8fafc;--ink2:#e2e8f0;--ink3:#94a3b8;--ink4:#64748b;
  --brand:#818cf8;--brand2:#6366f1;--brand3:#a78bfa;
  --line:rgba(255,255,255,0.08);--line2:rgba(255,255,255,0.12);
  --radius:20px;--container:min(1080px,100%);--nav-h:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink2);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
}
a{color:inherit;text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(20px,5vw,32px);width:100%}
::selection{background:rgba(129,140,248,0.25)}

/* Animated background */
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-mesh::before,.bg-mesh::after{
  content:'';position:absolute;border-radius:50%;filter:blur(140px);opacity:0.5;
}
.bg-mesh::before{width:600px;height:600px;background:#6366f1;top:-200px;left:-150px;animation:float1 20s ease-in-out infinite}
.bg-mesh::after{width:500px;height:500px;background:#a78bfa;bottom:-150px;right:-100px;animation:float2 25s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-30px)}}

/* Nav */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  background:rgba(10,10,15,0.6);backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid var(--line);
}
nav .inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}
nav .logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;letter-spacing:-0.01em}
nav .logo .mark{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#818cf8,#a78bfa);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 16px rgba(129,140,248,0.4);
}
nav .logo .mark svg{width:15px;height:15px;fill:#fff}
nav .links{display:flex;align-items:center;gap:clamp(16px,2.5vw,28px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
nav .links::-webkit-scrollbar{display:none}
nav .links a{font-size:14px;color:var(--ink3);font-weight:500;transition:all .2s;white-space:nowrap;flex-shrink:0;cursor:pointer;position:relative}
nav .links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--brand);border-radius:2px;transition:width .3s}
nav .links a:hover{color:var(--ink)}
nav .links a:hover::after{width:100%}

/* Hero */
.hero{
  position:relative;z-index:1;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--nav-h) + 40px) 0 60px;
}
.hero .badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:7px 16px;border-radius:100px;
  background:var(--surface);border:1px solid var(--line2);
  font-size:13px;color:var(--ink3);font-weight:500;
  margin-bottom:32px;backdrop-filter:blur(10px);
  animation:fadeUp .6s ease both;
}
.hero .badge .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.hero h1{
  font-size:clamp(40px,8vw,80px);font-weight:800;line-height:1.05;
  letter-spacing:clamp(-2px,-0.04em,-3px);color:var(--ink);
  margin-bottom:24px;position:relative;z-index:1;
  text-wrap:balance;animation:fadeUp .7s ease .1s both;
}
.hero h1 .grad{
  background:linear-gradient(135deg,#818cf8 0%,#a78bfa 40%,#f472b6 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-sub{
  font-size:clamp(16px,2.5vw,20px);color:var(--ink3);
  margin-bottom:48px;max-width:560px;line-height:1.7;
  position:relative;z-index:1;font-weight:400;
  animation:fadeUp .7s ease .2s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* Hero CTA */
.hero-cta{
  display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
  margin-bottom:64px;position:relative;z-index:1;
  animation:fadeUp .7s ease .3s both;
}
.btn-primary{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 32px;border-radius:14px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;font-size:16px;font-weight:600;
  box-shadow:0 8px 32px rgba(99,102,241,0.4);
  transition:all .3s;cursor:pointer;border:none;
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(99,102,241,0.5)}
.btn-primary svg{width:20px;height:20px;fill:currentColor}
.btn-ghost{
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 32px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line2);
  color:var(--ink2);font-size:16px;font-weight:600;
  transition:all .3s;cursor:pointer;
}
.btn-ghost:hover{background:var(--surface2);border-color:var(--ink4);transform:translateY(-2px)}
.btn-ghost svg{width:20px;height:20px;fill:currentColor}

/* Feature cards grid */
.cards-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;max-width:min(840px,100%);width:100%;
  margin:0 auto;position:relative;z-index:1;
  animation:fadeUp .7s ease .4s both;
}
.feature-card{
  position:relative;padding:28px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);
  transition:all .35s cubic-bezier(0.16,1,0.3,1);overflow:hidden;cursor:pointer;
}
.feature-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--card-glow,transparent),transparent 60%);
  opacity:0;transition:opacity .35s;
}
.feature-card:hover{
  transform:translateY(-6px);border-color:var(--line2);
  background:var(--surface2);box-shadow:0 24px 48px rgba(0,0,0,0.3);
}
.feature-card:hover::before{opacity:0.15}
.feature-card .fc-icon{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;position:relative;z-index:1;
}
.feature-card .fc-icon svg{width:24px;height:24px}
.feature-card h3{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px;position:relative;z-index:1;letter-spacing:-0.01em}
.feature-card p{font-size:14px;color:var(--ink3);line-height:1.6;position:relative;z-index:1}
.feature-card .arrow{position:absolute;top:28px;right:28px;opacity:0;transition:all .3s;z-index:1}
.feature-card .arrow svg{width:18px;height:18px;fill:var(--ink3)}
.feature-card:hover .arrow{opacity:1;transform:translateX(4px)}

/* Stats bar */
.stats{
  display:flex;justify-content:center;gap:clamp(32px,6vw,64px);
  margin-top:80px;position:relative;z-index:1;
  animation:fadeUp .7s ease .5s both;flex-wrap:wrap;
}
.stat{text-align:center}
.stat .num{font-size:clamp(28px,4vw,40px);font-weight:800;color:var(--ink);letter-spacing:-0.02em;
  background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .label{font-size:13px;color:var(--ink4);margin-top:4px;font-weight:500}

/* QR Modal */
.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{
  background:var(--bg2);border:1px solid var(--line2);border-radius:24px;
  padding:clamp(28px,5vw,40px);text-align:center;max-width:340px;width:100%;
  box-shadow:0 32px 80px rgba(0,0,0,0.5);animation:slideUp .35s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qr-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px}
.qr-box .qr-hint{font-size:14px;color:var(--ink3);margin-bottom:24px}
.qr-box .qr-img{width:min(220px,65vw);margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line2)}
.qr-box .qr-img img{width:100%;display:block}
.qr-box .qr-tip{margin-top:18px;font-size:13px;color:var(--brand);font-weight:600}
.qr-box .qr-close{margin-top:24px;padding:12px 28px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.qr-box .qr-close:hover{background:var(--surface2);border-color:var(--ink4)}

@media(max-width:520px){.cards-grid{grid-template-columns:1fr}.hero-cta{flex-direction:column;width:100%;max-width:320px;margin-left:auto;margin-right:auto}.btn-primary,.btn-ghost{justify-content:center}}
</style>
</head>
