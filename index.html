<title>冥城应用商店 — 车机应用平台</title>
<meta name="description" content="冥城应用商店 — 车机应用管理、资源下载、免费娱乐、手机互联、激活即用">
<style>
:root{
  --bg:#f7f8fc;--bg2:#ffffff;--bg3:#eef1f8;
  --ink:#0f172a;--ink2:#1e293b;--ink3:#64748b;--ink4:#94a3b8;
  --brand:#6366f1;--brand2:#8b5cf6;--brand3:#a855f7;
  --line:rgba(203,213,225,0.5);--line2:rgba(148,163,184,0.2);
  --radius:24px;--radius-sm:16px;--radius-xs:12px;
  --container:min(1080px,100%);--nav-h:60px;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink2);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
}
a{color:inherit;text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(16px,4vw,28px);width:100%}
::selection{background:rgba(99,102,241,0.15)}

/* ===== Nav ===== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  background:rgba(255,255,255,0.8);backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid var(--line2);
}
nav .inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}
nav .logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;flex-shrink:0;letter-spacing:-0.02em}
nav .logo .mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 14px rgba(99,102,241,0.4);
}
nav .logo .mark svg{width:15px;height:15px;fill:#fff}
nav .links{display:flex;align-items:center;gap:clamp(12px,2vw,22px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:4px 0}
nav .links::-webkit-scrollbar{display:none}
nav .links a{font-size:14px;color:var(--ink3);font-weight:500;transition:color .2s;white-space:nowrap;flex-shrink:0;cursor:pointer}
nav .links a:hover{color:var(--brand)}

/* ===== Hero ===== */
.hero{
  position:relative;z-index:1;text-align:center;
  padding:calc(var(--nav-h) + clamp(36px,6vw,60px)) 0 clamp(24px,3vw,32px);
  overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;z-index:-1;overflow:hidden;
}
.hero-bg .blob{
  position:absolute;border-radius:50%;filter:blur(80px);
}
.hero-bg .b1{width:500px;height:500px;background:rgba(99,102,241,0.12);top:-200px;left:50%;transform:translateX(-50%)}
.hero-bg .b2{width:300px;height:300px;background:rgba(168,85,247,0.08);top:-100px;left:10%}
.hero-bg .b3{width:280px;height:280px;background:rgba(139,92,246,0.07);top:0;right:5%}
.hero-bg .grid-bg{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(99,102,241,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,0.035) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent);
}
.hero .pill{
  display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:100px;
  background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(168,85,247,0.08));
  border:1px solid rgba(99,102,241,0.12);
  font-size:13px;color:var(--ink3);font-weight:600;margin-bottom:24px;
  backdrop-filter:blur(10px);animation:fadeUp .6s var(--ease) both;
}
.hero .pill .dot{width:7px;height:7px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{
  font-size:clamp(38px,8vw,72px);font-weight:900;line-height:1.05;
  letter-spacing:clamp(-2px,-0.04em,-3.5px);color:var(--ink);
  margin-bottom:18px;text-wrap:balance;animation:fadeUp .7s var(--ease) .08s both;
}
.hero h1 .grad{
  background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 40%,#a855f7 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-sub{
  font-size:clamp(15px,2.2vw,18px);color:var(--ink3);
  max-width:480px;margin:0 auto 36px;line-height:1.7;
  animation:fadeUp .7s var(--ease) .16s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* CTA */
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:48px;animation:fadeUp .7s var(--ease) .24s both}
.btn-p{
  display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 8px 28px -4px rgba(99,102,241,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
  transition:all .3s var(--ease);cursor:pointer;border:none;
}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 36px -4px rgba(99,102,241,0.5)}
.btn-p svg{width:18px;height:18px;fill:currentColor}
.btn-g{
  display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.7);border:1.5px solid var(--line);color:var(--ink2);font-size:15px;font-weight:600;
  backdrop-filter:blur(10px);transition:all .3s var(--ease);cursor:pointer;
}
.btn-g:hover{border-color:rgba(99,102,241,0.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,0.1)}
.btn-g svg{width:18px;height:18px;fill:currentColor}

/* ===== Feature Cards ===== */
.features-title{text-align:center;margin-bottom:24px;animation:fadeUp .6s var(--ease) .28s both}
.features-title h2{font-size:clamp(20px,3.5vw,28px);font-weight:800;color:var(--ink);letter-spacing:-0.5px}
.features-title .bar{width:40px;height:4px;border-radius:2px;background:linear-gradient(90deg,#6366f1,#a855f7);margin:10px auto 0}

.cards{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
  max-width:min(880px,100%);margin:0 auto;
  animation:fadeUp .7s var(--ease) .32s both;
}
.card{
  position:relative;padding:24px;border-radius:var(--radius);
  background:rgba(255,255,255,0.7);border:1.5px solid var(--line);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  transition:all .35s var(--ease);overflow:hidden;cursor:pointer;
  box-shadow:0 4px 24px rgba(99,102,241,0.06);
}
.card .top-bar{
  position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--card-grad);
  opacity:.8;transition:opacity .35s;
}
.card:hover{transform:translateY(-6px);border-color:rgba(99,102,241,0.15);background:rgba(255,255,255,0.85);box-shadow:0 12px 40px rgba(99,102,241,0.12)}
.card:hover .top-bar{opacity:1}
.card .ic{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;position:relative;z-index:1;
  background:var(--card-grad);box-shadow:0 6px 16px -4px var(--card-shadow);
  transition:transform .35s var(--ease);
}
.card:hover .ic{transform:scale(1.1) rotate(-3deg)}
.card .ic svg{width:24px;height:24px;fill:#fff}
.card h3{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:5px;position:relative;z-index:1;letter-spacing:-0.01em}
.card p{font-size:13.5px;color:var(--ink3);line-height:1.5;position:relative;z-index:1}
.card .ar{position:absolute;top:24px;right:24px;opacity:0;transition:all .3s;z-index:1}
.card .ar svg{width:16px;height:16px;fill:var(--ink4)}
.card:hover .ar{opacity:1;transform:translateX(4px)}

/* Tablet: 2 cols */
@media(max-width:768px){.cards{grid-template-columns:repeat(2,1fr)}}
/* Mobile: keep 2 cols, compact */
@media(max-width:480px){
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:18px 14px;border-radius:18px}
  .card .ic{width:40px;height:40px;border-radius:12px;margin-bottom:12px}
  .card .ic svg{width:20px;height:20px}
  .card h3{font-size:15px}
  .card p{font-size:12px}
  .card .ar{display:none}
}

/* Stats */
.stats{
  display:flex;justify-content:center;gap:clamp(28px,5vw,56px);
  margin-top:48px;animation:fadeUp .7s var(--ease) .4s both;flex-wrap:wrap;
}
.stat{text-align:center}
.stat .n{
  font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-0.03em;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.stat .l{font-size:13px;color:var(--ink4);margin-top:2px;font-weight:600}

/* QR Modal */
.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(15,23,42,0.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{background:#fff;border-radius:24px;padding:clamp(24px,4vw,36px);text-align:center;max-width:320px;width:100%;box-shadow:0 28px 64px rgba(15,23,42,0.2);animation:slideUp .35s var(--ease)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qt{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px}
.qr-box .qh{font-size:14px;color:var(--ink3);margin-bottom:20px}
.qr-box .qi{width:min(200px,60vw);margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.qr-box .qi img{width:100%;display:block}
.qr-box .qtp{margin-top:14px;font-size:13px;color:var(--brand);font-weight:600}
.qr-box .qc{margin-top:20px;padding:11px 26px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.qr-box .qc:hover{background:#e2e8f0}

@media(max-width:480px){.hero-cta{flex-direction:column;width:100%;max-width:280px;margin:0 auto 36px}.btn-p,.btn-g{justify-content:center}}
</style>
</head>
