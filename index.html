<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>冥城应用商店 — 车机应用平台</title>
<meta name="description" content="冥城应用商店 — 车机应用管理、资源下载、免费娱乐、手机互联、激活即用">
<style>
:root{
  --bg:#f8fafc;--bg2:#ffffff;--bg3:#f1f5f9;
  --surface:rgba(255,255,255,0.65);--surface2:rgba(255,255,255,0.8);--surface3:rgba(255,255,255,0.9);
  --ink:#0f172a;--ink2:#1e293b;--ink3:#475569;--ink4:#94a3b8;--ink5:#cbd5e1;
  --brand:#6366f1;--brand2:#818cf8;--brand3:#a855f7;--brand4:#c084fc;
  --brand-grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);
  --brand-bg:rgba(99,102,241,0.08);
  --line:rgba(226,232,240,0.5);--line2:rgba(203,213,225,0.6);--line3:rgba(148,163,184,0.3);
  --radius:20px;--radius-sm:14px;--radius-xs:10px;
  --container:min(1120px,100%);--nav-h:56px;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --shadow:0 8px 32px rgba(99,102,241,0.08);
  --shadow-hover:0 16px 48px rgba(99,102,241,0.15);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink2);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
}
a{color:inherit;text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(20px,5vw,36px);width:100%}
::selection{background:rgba(99,102,241,0.15)}

/* Background mesh */
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-mesh::before,.bg-mesh::after{content:'';position:absolute;border-radius:50%;filter:blur(100px)}
.bg-mesh::before{width:520px;height:520px;background:rgba(129,140,248,0.18);top:-160px;left:-100px;animation:drift1 24s ease-in-out infinite}
.bg-mesh::after{width:440px;height:440px;background:rgba(192,132,252,0.12);top:20%;right:-120px;animation:drift2 30s ease-in-out infinite}
.bg-mesh .b3{position:absolute;width:380px;height:380px;border-radius:50%;filter:blur(100px);background:rgba(129,140,248,0.08);bottom:-80px;left:25%;animation:drift1 28s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,40px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-30px)}}

/* Nav */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  background:rgba(255,255,255,0.72);backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);border-bottom:1px solid var(--line);
}
nav .inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}
nav .logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;letter-spacing:-0.01em}
nav .logo .mark{
  width:28px;height:28px;border-radius:8px;background:var(--brand-grad);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 3px 12px rgba(99,102,241,0.35),inset 0 1px 0 rgba(255,255,255,0.3);
}
nav .logo .mark svg{width:14px;height:14px;fill:#fff}
nav .links{display:flex;align-items:center;gap:clamp(14px,2.2vw,24px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:4px 0}
nav .links::-webkit-scrollbar{display:none}
nav .links a{font-size:13.5px;color:var(--ink3);font-weight:500;transition:color .2s;white-space:nowrap;flex-shrink:0;cursor:pointer;position:relative}
nav .links a:hover{color:var(--brand)}
nav .links a::after{content:'';position:absolute;bottom:-6px;left:50%;width:0;height:2px;background:var(--brand);border-radius:1px;transition:width .25s,left .25s}
nav .links a:hover::after{width:14px;left:calc(50% - 7px)}

/* Hero */
.hero{position:relative;z-index:1;padding:calc(var(--nav-h) + clamp(40px,7vw,72px)) 0 clamp(32px,4vw,48px);text-align:center}
.hero .pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:100px;
  background:var(--surface);border:1px solid var(--line2);font-size:12.5px;color:var(--ink3);
  font-weight:500;margin-bottom:28px;backdrop-filter:blur(10px);box-shadow:var(--shadow);
  animation:fadeUp .6s var(--ease) both;
}
.hero .pill .dot{width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{
  font-size:clamp(36px,7.5vw,68px);font-weight:800;line-height:1.08;letter-spacing:clamp(-1.5px,-0.04em,-3px);
  color:var(--ink);margin-bottom:20px;text-wrap:balance;animation:fadeUp .7s var(--ease) .08s both;
}
.hero h1 .grad{
  background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-sub{font-size:clamp(15px,2.2vw,18px);color:var(--ink3);max-width:520px;margin:0 auto 40px;line-height:1.7;animation:fadeUp .7s var(--ease) .16s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* CTA */
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:56px;animation:fadeUp .7s var(--ease) .24s both}
.btn-p{
  display:inline-flex;align-items:center;gap:9px;padding:15px 30px;border-radius:var(--radius-sm);
  background:var(--brand-grad);color:#fff;font-size:15px;font-weight:600;
  box-shadow:0 6px 24px rgba(99,102,241,0.3),inset 0 1px 0 rgba(255,255,255,0.25);
  transition:all .3s var(--ease);cursor:pointer;border:none;
}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(99,102,241,0.4)}
.btn-p svg{width:18px;height:18px;fill:currentColor}
.btn-g{
  display:inline-flex;align-items:center;gap:9px;padding:15px 30px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--line2);color:var(--ink2);font-size:15px;font-weight:600;
  backdrop-filter:blur(10px);transition:all .3s var(--ease);cursor:pointer;
}
.btn-g:hover{background:var(--surface2);border-color:var(--line3);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.btn-g svg{width:18px;height:18px;fill:currentColor}

/* Feature cards grid - ALL features as big buttons */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;max-width:min(960px,100%);margin:0 auto;animation:fadeUp .7s var(--ease) .32s both}
.card{
  position:relative;padding:28px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  transition:all .35s var(--ease);overflow:hidden;cursor:pointer;
  box-shadow:var(--shadow);
}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--gl,transparent) 0%,transparent 50%);opacity:0;transition:opacity .35s}
.card::after{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent)}
.card:hover{transform:translateY(-6px);border-color:var(--line2);background:var(--surface2);box-shadow:var(--shadow-hover)}
.card:hover::before{opacity:.06}
.card .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative;z-index:1;transition:transform .35s var(--ease)}
.card:hover .ic{transform:scale(1.08)}
.card .ic svg{width:26px;height:26px}
.card h3{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px;position:relative;z-index:1;letter-spacing:-0.01em}
.card p{font-size:14px;color:var(--ink3);line-height:1.5;position:relative;z-index:1}
.card .ar{position:absolute;top:28px;right:28px;opacity:0;transition:all .3s;z-index:1}
.card .ar svg{width:18px;height:18px;fill:var(--ink4)}
.card:hover .ar{opacity:1;transform:translateX(4px)}

/* Stats */
.stats{display:flex;justify-content:center;gap:clamp(32px,5vw,56px);margin-top:56px;animation:fadeUp .7s var(--ease) .4s both;flex-wrap:wrap}
.stat{text-align:center}
.stat .n{font-size:clamp(26px,3.5vw,36px);font-weight:800;letter-spacing:-0.03em;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-size:12.5px;color:var(--ink4);margin-top:3px;font-weight:500}

/* QR Modal */
.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(15,23,42,0.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:clamp(24px,4vw,36px);text-align:center;max-width:320px;width:100%;box-shadow:0 28px 64px rgba(15,23,42,0.15);animation:slideUp .35s var(--ease)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qt{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:3px}
.qr-box .qh{font-size:13.5px;color:var(--ink3);margin-bottom:22px}
.qr-box .qi{width:min(200px,60vw);margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line2)}
.qr-box .qi img{width:100%;display:block}
.qr-box .qtp{margin-top:16px;font-size:12.5px;color:var(--brand);font-weight:600}
.qr-box .qc{margin-top:22px;padding:11px 26px;background:var(--bg3);border:1px solid var(--line2);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.qr-box .qc:hover{background:var(--line);border-color:var(--line3)}

@media(max-width:520px){.cards{grid-template-columns:1fr}.hero-cta{flex-direction:column;width:100%;max-width:300px;margin:0 auto 40px}.btn-p,.btn-g{justify-content:center}}
</style>
</head>
