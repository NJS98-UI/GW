<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>冥城应用商店 - 车机应用商店</title>
<meta name="description" content="冥城应用商店 - 车机应用管理、资源下载、免费娱乐、手机互联、激活即用">
<style>
:root {
  --bg: #ffffff;
  --bg-alt: #f8fafc;
  --ink: #0a1628;
  --ink-2: #1e293b;
  --ink-3: #5b6c8a;
  --ink-4: #94a3b8;
  --brand: #4f46e5;
  --brand-2: #2563eb;
  --brand-bg: #eef2ff;
  --line: rgba(226,232,240,0.6);
  --radius: 16px;
  --container: min(1060px, 100%);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  color:var(--ink-2);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
}
a{color:var(--brand);text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(16px, 4vw, 24px)}
::selection{background:rgba(79,70,229,0.18)}

/* Nav */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
}
nav .inner{
  display:flex;align-items:center;justify-content:space-between;
  height:clamp(50px, 7vh, 58px);gap:12px;
}
nav .logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0}
nav .logo .mark{
  width:clamp(24px, 3.2vw, 28px);height:clamp(24px, 3.2vw, 28px);border-radius:7px;
  background:linear-gradient(135deg,#6366f1,#2563eb);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 3px 10px rgba(79,70,229,0.3);
}
nav .logo .mark svg{width:13px;height:13px;fill:#fff}
nav .links{
  display:flex;align-items:center;
  gap:clamp(14px, 2.6vw, 28px);
  overflow-x:auto;overscroll-behavior-x:contain;
  scrollbar-width:none;-ms-overflow-style:none;
  padding:4px 0;
}
nav .links::-webkit-scrollbar{display:none}
nav .links a{
  font-size:clamp(11.5px, 2.4vw, 13px);
  color:var(--ink-3);font-weight:500;transition:color .2s;white-space:nowrap;flex-shrink:0;cursor:pointer;
}
nav .links a:hover{color:var(--ink-2)}

/* Hero */
.hero{
  position:relative;overflow:hidden;text-align:center;
  padding:clamp(80px, 14vh, 130px) 0 clamp(50px, 7vw, 80px);
  background:linear-gradient(180deg,#f4f6fe 0%,#ebefff 25%,#ffffff 60%);
  min-height:calc(100vh - 58px);min-height:calc(100dvh - 58px);
  display:flex;flex-direction:column;justify-content:center;
}
.hero .glow{
  position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none;
}
.hero .glow-1{width:min(600px,80vw);aspect-ratio:1;background:rgba(199,210,254,0.5);top:-300px;left:-100px}
.hero .glow-2{width:min(500px,70vw);aspect-ratio:1;background:rgba(196,181,253,0.35);top:-200px;right:-120px}
.hero h1{
  font-size:clamp(34px, 6.5vw, 64px);font-weight:800;line-height:1.1;
  letter-spacing:clamp(-2px, -0.35vw, -2.5px);color:var(--ink);
  margin-bottom:clamp(24px, 4vw, 36px);position:relative;z-index:1;
  text-wrap:balance;
}
.hero h1 .grad{
  background:linear-gradient(120deg,#4f46e5 0%,#2563eb 50%,#0ea5e9 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-sub{
  font-size:clamp(14px, 2.2vw, 16px);color:var(--ink-3);
  margin-bottom:clamp(32px, 5vw, 44px);max-width:480px;margin-left:auto;margin-right:auto;
  position:relative;z-index:1;line-height:1.8;
}

/* Nav cards */
.nav-cards{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:clamp(12px, 2vw, 16px);
  max-width:min(680px, 100%);margin:0 auto;position:relative;z-index:1;
}
.nav-card{
  display:flex;align-items:center;gap:14px;
  padding:clamp(16px, 2.5vw, 22px) clamp(18px, 3vw, 26px);
  border-radius:14px;
  background:#fff;border:1.5px solid var(--line);
  box-shadow:0 4px 16px rgba(15,23,42,0.04);
  transition:all .3s;cursor:pointer;text-decoration:none;color:inherit;
}
.nav-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(79,70,229,0.1);
  border-color:var(--brand);
}
.nav-card .card-icon{
  width:clamp(40px, 5vw, 48px);height:clamp(40px, 5vw, 48px);border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.nav-card .card-icon svg{width:clamp(20px, 2.8vw, 24px);height:clamp(20px, 2.8vw, 24px)}
.nav-card .card-text{text-align:left;min-width:0}
.nav-card .card-text strong{display:block;font-size:clamp(14px, 2vw, 16px);font-weight:700;color:var(--ink);margin-bottom:1px}
.nav-card .card-text span{font-size:clamp(11.5px, 1.7vw, 12.5px);color:var(--ink-3)}

/* QR Modal */
.qr-modal{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(15,23,42,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px;
}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{
  background:#fff;border-radius:20px;padding:clamp(24px, 4vw, 36px);
  text-align:center;max-width:320px;width:100%;
  box-shadow:0 20px 60px rgba(15,23,42,0.2);
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qr-title{
  font-size:clamp(16px, 2.4vw, 18px);font-weight:700;color:var(--ink);margin-bottom:4px;
}
.qr-box .qr-hint{
  font-size:clamp(13px, 1.9vw, 14px);color:var(--ink-3);margin-bottom:clamp(16px, 2.5vw, 22px);
}
.qr-box .qr-img{
  width:min(200px, 60vw);margin:0 auto;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);
}
.qr-box .qr-img img{width:100%;display:block}
.qr-box .qr-tip{
  margin-top:clamp(14px, 2vw, 18px);font-size:clamp(12px, 1.8vw, 13px);
  color:var(--brand);font-weight:600;
}
.qr-box .qr-close{
  margin-top:clamp(16px, 2.5vw, 22px);padding:10px 24px;
  background:var(--brand-bg);border:none;border-radius:10px;
  font-size:14px;font-weight:600;color:var(--brand);cursor:pointer;
  transition:all .2s;
}
.qr-box .qr-close:hover{background:var(--brand);color:#fff}

/* Footer */
footer{border-top:1px solid var(--line);background:var(--bg-alt);padding:clamp(20px, 3vw, 28px) clamp(16px, 4vw, 24px)}
footer .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
footer .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(13px, 2vw, 14px);color:var(--ink);white-space:nowrap}
footer .brand .mark{width:clamp(22px, 3vw, 26px);height:clamp(22px, 3vw, 26px);border-radius:6px;background:linear-gradient(135deg,#6366f1,#2563eb);display:flex;align-items:center;justify-content:center;flex-shrink:0}
footer .brand .mark svg{width:12px;height:12px;fill:#fff}
footer .links{display:flex;gap:clamp(16px, 2.4vw, 22px);flex-wrap:wrap}
footer .links a{font-size:clamp(12px, 1.8vw, 12.5px);color:var(--ink-4);transition:color .2s;cursor:pointer}
footer .links a:hover{color:var(--brand)}
footer .copy{font-size:clamp(11px, 1.7vw, 12px);color:var(--ink-4)}

@media(max-width:480px){
  .nav-cards{grid-template-columns:1fr}
}
@media(max-width:360px){
  .hero h1{font-size:clamp(30px, 8.5vw, 34px)}
}
</style>
</head>

function showQR(){
