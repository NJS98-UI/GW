<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>所需工具 — 冥城应用商店</title>
<meta name="description" content="冥城应用商店车机安装所需工具 — 手机安装、电脑安装、U盘">
<style>
:root{
  --bg:#0a0a0f;--bg2:#0f0f17;--bg3:#131320;
  --surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.06);--surface3:rgba(255,255,255,0.08);
  --ink:#f8fafc;--ink2:#e2e8f0;--ink3:#94a3b8;--ink4:#64748b;
  --brand:#818cf8;--brand2:#6366f1;--brand3:#8b5cf6;--brand4:#a78bfa;
  --brand-grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  --line:rgba(255,255,255,0.08);--line2:rgba(255,255,255,0.12);
  --radius:20px;--container:min(1080px,100%);--nav-h:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink2);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
  padding-top:var(--nav-h);
}
a{color:inherit;text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(20px,5vw,32px);width:100%}
::selection{background:rgba(129,140,248,0.28);color:#fff}
img{display:block;max-width:100%}

.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-mesh::before,.bg-mesh::after{content:'';position:absolute;border-radius:50%;filter:blur(140px);opacity:0.42}
.bg-mesh::before{width:620px;height:620px;background:#6366f1;top:-220px;left:-160px;animation:float1 22s ease-in-out infinite}
.bg-mesh::after{width:520px;height:520px;background:#8b5cf6;bottom:-180px;right:-120px;animation:float2 27s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,50px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-40px)}}

main{position:relative;z-index:1}

nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  background:rgba(10,10,15,0.6);backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid var(--line);
}
nav .inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}
nav .logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;letter-spacing:-0.01em}
nav .logo .mark{
  width:30px;height:30px;border-radius:8px;background:var(--brand-grad);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 4px 16px rgba(129,140,248,0.4),inset 0 1px 0 rgba(255,255,255,0.25);
}
nav .logo .mark svg{width:15px;height:15px;fill:#fff}
nav .links{display:flex;align-items:center;gap:clamp(16px,2.5vw,28px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:4px 0}
nav .links::-webkit-scrollbar{display:none}
nav .links a{font-size:14px;color:var(--ink3);font-weight:500;transition:color .2s;white-space:nowrap;flex-shrink:0;cursor:pointer;position:relative}
nav .links a::after{content:'';position:absolute;bottom:-6px;left:0;width:0;height:2px;background:var(--brand);border-radius:2px;transition:width .3s}
nav .links a:hover{color:var(--ink)}
nav .links a:hover::after{width:100%}
nav .links a.active{color:var(--ink)}
nav .links a.active::after{width:100%}

.page-title{text-align:center;padding:clamp(48px,7vw,72px) 0 clamp(28px,4vw,40px)}
.page-title .pt-badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:100px;
  background:var(--surface);border:1px solid var(--line2);font-size:13px;color:var(--ink3);
  font-weight:500;margin-bottom:24px;backdrop-filter:blur(10px);
}
.page-title .pt-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:pulse 2.4s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.page-title h1{
  font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1.12;
  color:var(--ink);margin-bottom:14px;text-wrap:balance;
  background:linear-gradient(180deg,#fff 0%,#cbd5e1 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.page-title p{font-size:clamp(14px,2vw,16px);color:var(--ink3);max-width:540px;margin:0 auto;line-height:1.7}

.step-section{padding:clamp(20px,3vw,32px) 0}

.glass{
  position:relative;border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
  border:1px solid var(--line2);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 24px 60px -24px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.06);
}
.glass::before{
  content:'';position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(129,140,248,0.5),transparent);
}

.step-card{padding:clamp(22px,3.5vw,38px);max-width:min(820px,100%);margin:0 auto}
.step-card .step-head{display:flex;align-items:flex-start;gap:clamp(14px,2vw,18px);margin-bottom:clamp(20px,3vw,28px)}
.step-num{
  width:clamp(42px,5vw,50px);height:clamp(42px,5vw,50px);border-radius:50%;flex-shrink:0;
  background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:clamp(16px,2.2vw,19px);font-weight:800;letter-spacing:-.02em;
  box-shadow:0 8px 24px -4px rgba(99,102,241,0.55),inset 0 1px 0 rgba(255,255,255,0.3);
}
.step-num svg{width:clamp(20px,2.6vw,24px);height:clamp(20px,2.6vw,24px);fill:#fff}
.step-text{padding-top:2px}
.step-text h2{font-size:clamp(18px,2.8vw,24px);font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:6px;letter-spacing:-0.01em}
.step-text p{font-size:clamp(13px,1.9vw,15px);color:var(--ink3);line-height:1.7}

.tools-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,20px)}
.tools-grid .tool-card{
  border-radius:16px;overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.01));
  box-shadow:0 14px 40px -16px rgba(0,0,0,0.6);
  display:flex;flex-direction:column;transition:transform .35s cubic-bezier(0.16,1,0.3,1),border-color .35s;
}
.tools-grid .tool-card:hover{transform:translateY(-4px);border-color:var(--brand)}
.tools-grid .tool-card img{width:100%;display:block;aspect-ratio:auto}
.tools-grid .tool-card .cap{
  padding:clamp(13px,1.8vw,17px) clamp(14px,1.8vw,18px);
  font-size:clamp(12.5px,1.7vw,14px);color:var(--ink2);font-weight:500;line-height:1.6;
  border-top:1px solid var(--line);background:rgba(255,255,255,0.02);
}
.tools-grid .tool-card.span-full{grid-column:1 / -1;max-width:480px;width:100%;margin-inline:auto}
@media(max-width:560px){.tools-grid{grid-template-columns:1fr;max-width:440px;margin-inline:auto}.tools-grid .tool-card.span-full{max-width:100%}}

.back-home{text-align:center;padding:clamp(44px,6vw,64px) 0 clamp(56px,8vw,80px)}
.back-home a{
  display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:14px;
  background:var(--brand-grad);color:#fff;font-size:14px;font-weight:600;
  box-shadow:0 12px 32px -6px rgba(99,102,241,0.55),inset 0 1px 0 rgba(255,255,255,0.25);
  transition:transform .25s,box-shadow .25s;
}
.back-home a:hover{transform:translateY(-2px);box-shadow:0 18px 40px -6px rgba(99,102,241,0.65)}
.back-home a svg{width:18px;height:18px;fill:#fff}

.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.bg-mesh::before,.bg-mesh::after{animation:none}}

.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{
  background:var(--bg2);border:1px solid var(--line2);border-radius:24px;
  padding:clamp(28px,5vw,40px);text-align:center;max-width:340px;width:100%;
  box-shadow:0 24px 70px -12px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.06);
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qr-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px}
.qr-box .qr-hint{font-size:14px;color:var(--ink3);margin-bottom:24px}
.qr-box .qr-img{width:min(220px,65vw);margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#fff;padding:8px}
.qr-box .qr-img img{width:100%;display:block;border-radius:8px}
.qr-box .qr-tip{margin-top:18px;font-size:13px;color:var(--brand);font-weight:600}
.qr-box .qr-close{margin-top:24px;padding:12px 28px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.qr-box .qr-close:hover{background:var(--surface2);border-color:var(--ink4)}
</style>
</head>
<body>

<nav>
  <div class="container inner">
    <a class="logo" href="index.html">
      <span class="mark">
        <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm-2 15l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      </span>
      <span>冥城应用商店</span>
    </a>
    <div class="links">
      <a href="index.html">首页</a>
      <a href="features.html">功能特性</a>
      <a href="tools.html" class="active">所需工具</a>
      <a href="tutorial.html">安装教程</a>
      <a href="download.html">下载</a>
      <a href="javascript:void(0)" onclick="showQR()">联系管理员</a>
    </div>
  </div>
</nav>

<div class="bg-mesh" aria-hidden="true"></div>

<main>

<header class="page-title">
  <div class="container">
    <span class="pt-badge"><span class="dot"></span>安装前准备</span>
    <h1>所需工具</h1>
    <p>安装前请准备好以下工具，手机安装和电脑安装所需工具不同</p>
  </div>
</header>

<section class="step-section">
  <div class="container">
    <article class="glass step-card reveal">
      <div class="tools-grid">
        <div class="tool-card">
          <img src="docs/tools-phone.png" alt="手机安装所需工具">
          <div class="cap">手机安装：安卓手机 + OTG线（二选一） + 双公头USB线（0.5-1米）</div>
        </div>
        <div class="tool-card">
          <img src="docs/tools-pc.jpg" alt="电脑安装所需工具">
          <div class="cap">电脑安装：Windows笔记本 + 双公头USB线</div>
        </div>
        <div class="tool-card span-full">
          <img src="docs/tools-udisk.jpg" alt="U盘">
          <div class="cap">U盘（X70L车型专用，仅需U盘即可打开ADB）</div>
        </div>
      </div>
    </article>
  </div>
</section>

<div class="back-home">
  <a href="index.html">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    返回首页
  </a>
</div>

</main>

<div class="qr-modal" id="qrModal" onclick="if(event.target===this)closeQR()">
  <div class="qr-box">
    <div class="qr-title">联系管理员</div>
    <div class="qr-hint">微信扫一扫添加好友</div>
    <div class="qr-img"><img src="docs/admin.jpg" alt="管理员微信二维码"></div>
    <div class="qr-tip">微信扫一扫</div>
    <button class="qr-close" onclick="closeQR()">关闭</button>
  </div>
</div>

<script>
function showQR(){document.getElementById('qrModal').classList.add('show');document.body.style.overflow='hidden'}
function closeQR(){document.getElementById('qrModal').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeQR()});
(function(){
  var els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)||window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    els.forEach(function(el){el.classList.add('in')});return;
  }
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}
    });
  },{threshold:0.12,rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
