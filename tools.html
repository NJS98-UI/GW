<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>所需工具 — 冥城应用商店</title>
<meta name="description" content="冥城应用商店车机安装所需工具 — 手机安装、电脑安装、U盘">
<style>
:root{
  --bg:#07070b;--bg2:#0d0d14;--bg3:#111119;
  --surface:rgba(255,255,255,0.035);--surface2:rgba(255,255,255,0.06);--surface3:rgba(255,255,255,0.09);
  --ink:#fafafa;--ink2:#d4d4d8;--ink3:#a1a1aa;--ink4:#71717a;--ink5:#52525b;
  --brand:#6366f1;--brand2:#818cf8;--brand3:#a855f7;--brand4:#c084fc;
  --brand-grad:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);
  --line:rgba(255,255,255,0.06);--line2:rgba(255,255,255,0.1);--line3:rgba(255,255,255,0.14);
  --radius:18px;--radius-sm:12px;--radius-xs:8px;
  --container:min(1120px,100%);--nav-h:56px;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink2);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;padding-top:var(--nav-h);
}
a{color:inherit;text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(20px,5vw,36px);width:100%}
::selection{background:rgba(99,102,241,0.3);color:#fff}
img{display:block;max-width:100%}

.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-mesh::before,.bg-mesh::after{content:'';position:absolute;border-radius:50%;filter:blur(120px)}
.bg-mesh::before{width:560px;height:560px;background:rgba(99,102,241,0.18);top:-180px;left:-120px;animation:drift1 24s ease-in-out infinite}
.bg-mesh::after{width:480px;height:480px;background:rgba(168,85,247,0.14);top:30%;right:-140px;animation:drift2 30s ease-in-out infinite}
.bg-mesh .b3{position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(120px);background:rgba(99,102,241,0.08);bottom:-100px;left:30%;animation:drift1 28s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,40px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-30px)}}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,#000 30%,transparent 80%);
}

main{position:relative;z-index:1}

nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);
  background:rgba(7,7,11,0.72);backdrop-filter:blur(20px) saturate(1.6);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--line);
}
nav .inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}
nav .logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;letter-spacing:-0.01em}
nav .logo .mark{
  width:28px;height:28px;border-radius:7px;background:var(--brand-grad);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 3px 12px rgba(99,102,241,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
}
nav .logo .mark svg{width:14px;height:14px;fill:#fff}
nav .links{display:flex;align-items:center;gap:clamp(14px,2.2vw,24px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:4px 0}
nav .links::-webkit-scrollbar{display:none}
nav .links a{font-size:13.5px;color:var(--ink3);font-weight:500;transition:color .2s;white-space:nowrap;flex-shrink:0;cursor:pointer;position:relative}
nav .links a:hover{color:var(--ink)}
nav .links a::after{content:'';position:absolute;bottom:-6px;left:50%;width:0;height:2px;background:var(--brand2);border-radius:1px;transition:width .25s,left .25s}
nav .links a:hover::after{width:14px;left:calc(50% - 7px)}
nav .links a.active{color:var(--ink)}
nav .links a.active::after{width:14px;left:calc(50% - 7px)}

.page-title{text-align:center;padding:clamp(40px,6vw,64px) 0 clamp(24px,3.5vw,36px)}
.page-title .pill{
  display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:100px;
  background:var(--surface2);border:1px solid var(--line2);font-size:12.5px;color:var(--ink3);
  font-weight:500;margin-bottom:24px;backdrop-filter:blur(8px);
}
.page-title .pill .dot{width:6px;height:6px;border-radius:50%;background:#fbbf24;box-shadow:0 0 6px #fbbf24;animation:blink 2.4s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.page-title h1{
  font-size:clamp(30px,5.5vw,48px);font-weight:800;letter-spacing:-1.5px;line-height:1.12;
  color:var(--ink);margin-bottom:12px;text-wrap:balance;
  background:linear-gradient(180deg,#fafafa 0%,#a1a1aa 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.page-title p{font-size:clamp(14px,2vw,16px);color:var(--ink3);max-width:520px;margin:0 auto;line-height:1.7}

.glass{
  position:relative;border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));
  border:1px solid var(--line2);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:0 20px 48px -20px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);
}
.glass::before{
  content:'';position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(129,140,248,0.4),transparent);
}

.tools-section{padding:clamp(16px,2.5vw,24px) 0}
.tools-card{padding:clamp(20px,3vw,32px);max-width:min(820px,100%);margin:0 auto}
.tools-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,2vw,16px)}
.tools-grid .tool-card{
  border-radius:14px;overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01));
  box-shadow:0 14px 40px -14px rgba(0,0,0,0.5);
  display:flex;flex-direction:column;transition:transform .35s var(--ease),border-color .35s;
}
.tools-grid .tool-card:hover{transform:translateY(-4px);border-color:var(--brand2)}
.tools-grid .tool-card img{width:100%;display:block}
.tools-grid .tool-card .cap{
  padding:clamp(12px,1.7vw,15px) clamp(13px,1.7vw,16px);
  font-size:clamp(12px,1.6vw,13px);color:var(--ink2);font-weight:500;line-height:1.6;
  border-top:1px solid var(--line);background:rgba(255,255,255,0.02);
}
.tools-grid .tool-card.span-full{grid-column:1 / -1;max-width:460px;width:100%;margin-inline:auto}
@media(max-width:560px){.tools-grid{grid-template-columns:1fr;max-width:420px;margin-inline:auto}.tools-grid .tool-card.span-full{max-width:100%}}

.back-home{text-align:center;padding:clamp(36px,5vw,52px) 0 clamp(48px,7vw,64px)}
.back-home a{
  display:inline-flex;align-items:center;gap:7px;padding:13px 28px;border-radius:var(--radius-sm);
  background:var(--brand-grad);color:#fff;font-size:14px;font-weight:600;
  box-shadow:0 10px 28px -6px rgba(99,102,241,0.5),inset 0 1px 0 rgba(255,255,255,0.2);
  transition:transform .25s,box-shadow .25s;
}
.back-home a:hover{transform:translateY(-2px);box-shadow:0 14px 32px -6px rgba(99,102,241,0.6)}
.back-home a svg{width:17px;height:17px;fill:#fff}

.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.bg-mesh *{animation:none}}

.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:clamp(24px,4vw,36px);text-align:center;max-width:320px;width:100%;box-shadow:0 28px 64px rgba(0,0,0,0.5);animation:slideUp .35s var(--ease)}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qt{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:3px}
.qr-box .qh{font-size:13.5px;color:var(--ink3);margin-bottom:22px}
.qr-box .qi{width:min(200px,60vw);margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#fff;padding:6px}
.qr-box .qi img{width:100%;display:block;border-radius:8px}
.qr-box .qtp{margin-top:16px;font-size:12.5px;color:var(--brand2);font-weight:600}
.qr-box .qc{margin-top:22px;padding:11px 26px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.qr-box .qc:hover{background:var(--surface2);border-color:var(--line3)}
</style>
</head>
<body>

<nav>
  <div class="container inner">
    <div class="logo">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm-2 15l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg></span>
      冥城应用商店
    </div>
    <div class="links">
      <a href="index.html">首页</a>
      <a href="features.html">功能特性</a>
      <a href="tools.html" class="active">所需工具</a>
      <a href="tutorial.html">安装教程</a>
      <a href="download.html">下载</a>
      <a href="javascript:void(0)" onclick="showQR()">联系管理员</a>
    </div>
  </div>
</nav>

<div class="bg-mesh"><div class="b3"></div></div>

<main>

<header class="page-title">
  <div class="container">
    <span class="pill"><span class="dot"></span>安装前准备</span>
    <h1>所需工具</h1>
    <p>安装前请准备好以下工具，手机安装和电脑安装所需工具不同</p>
  </div>
</header>

<section class="tools-section">
  <div class="container">
    <article class="glass tools-card reveal">
      <div class="tools-grid">
        <div class="tool-card">
          <img src="docs/tools-phone.png" alt="手机安装所需工具">
          <div class="cap">手机安装：安卓手机 + OTG线（二选一） + 双公头USB线（0.5-1米）</div>
        </div>
        <div class="tool-card">
          <img src="docs/tools-pc.jpg" alt="电脑安装所需工具">
          <div class="cap">电脑安装：Windows笔记本 + 双公头USB线</div>
        </div>
        <div class="tool-card span-full">
          <img src="docs/tools-udisk.jpg" alt="U盘">
          <div class="cap">U盘（X70L车型专用，仅需U盘即可打开ADB）</div>
        </div>
      </div>
    </article>
  </div>
</section>

<div class="back-home">
  <a href="index.html">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    返回首页
  </a>
</div>

</main>

<div class="qr-modal" id="qrModal" onclick="if(event.target===this)closeQR()">
  <div class="qr-box">
    <div class="qt">联系管理员</div>
    <div class="qh">微信扫一扫添加好友</div>
    <div class="qi"><img src="docs/admin.jpg" alt="管理员微信二维码"></div>
    <div class="qtp">微信扫一扫</div>
    <button class="qc" onclick="closeQR()">关闭</button>
  </div>
</div>

<script>
function showQR(){document.getElementById('qrModal').classList.add('show');document.body.style.overflow='hidden'}
function closeQR(){document.getElementById('qrModal').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeQR()});
(function(){
  var els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)||window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    els.forEach(function(el){el.classList.add('in')});return;
  }
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}});
  },{threshold:0.1,rootMargin:'0px 0px -6% 0px'});
  els.forEach(function(el){io.observe(el)});
})();
</script>
</body>
</html>
