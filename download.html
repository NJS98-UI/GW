<style>
:root{
  --bg:#0a0a0f;--bg2:#0f0f17;--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.06);
  --ink:#f8fafc;--ink2:#e2e8f0;--ink3:#94a3b8;--ink4:#64748b;
  --brand:#818cf8;--brand2:#6366f1;--brand3:#a78bfa;
  --line:rgba(255,255,255,0.08);--line2:rgba(255,255,255,0.12);
  --radius:20px;--container:min(1080px,100%);--nav-h:60px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink2);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(20px,5vw,32px);width:100%}
::selection{background:rgba(129,140,248,0.25)}

.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-mesh::before,.bg-mesh::after{content:'';position:absolute;border-radius:50%;filter:blur(140px);opacity:0.5}
.bg-mesh::before{width:600px;height:600px;background:#6366f1;top:-200px;left:-150px;animation:float1 20s ease-in-out infinite}
.bg-mesh::after{width:500px;height:500px;background:#a78bfa;bottom:-150px;right:-100px;animation:float2 25s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-30px)}}

nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);background:rgba(10,10,15,0.6);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid var(--line)}
nav .inner{display:flex;align-items:center;justify-content:space-between;height:100%;gap:16px}
nav .logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0;letter-spacing:-0.01em}
nav .logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#818cf8,#a78bfa);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(129,140,248,0.4)}
nav .logo .mark svg{width:15px;height:15px;fill:#fff}
nav .links{display:flex;align-items:center;gap:clamp(16px,2.5vw,28px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
nav .links::-webkit-scrollbar{display:none}
nav .links a{font-size:14px;color:var(--ink3);font-weight:500;transition:all .2s;white-space:nowrap;flex-shrink:0;cursor:pointer;position:relative}
nav .links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--brand);border-radius:2px;transition:width .3s}
nav .links a:hover{color:var(--ink)}
nav .links a:hover::after{width:100%}
nav .links a.active{color:var(--ink);font-weight:600}
nav .links a.active::after{width:100%}

.page-head{text-align:center;padding:calc(var(--nav-h) + 60px) 0 40px;position:relative;z-index:1}
.page-head h1{font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:clamp(-1px,-0.03em,-2.5px);color:var(--ink);line-height:1.1;margin-bottom:12px}
.page-head h1 .grad{background:linear-gradient(135deg,#818cf8,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-head p{font-size:clamp(15px,2.2vw,18px);color:var(--ink3);max-width:520px;margin:0 auto;line-height:1.7}

.hub{position:relative;z-index:1;padding:0 0 clamp(48px,7vw,72px)}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(16px,2.5vw,24px);max-width:min(920px,100%);margin:0 auto}
.dl-card{display:flex;flex-direction:column;padding:clamp(20px,3vw,28px);border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);transition:all .35s cubic-bezier(0.16,1,0.3,1);overflow:hidden}
.dl-card:hover{transform:translateY(-6px);border-color:var(--line2);background:var(--surface2);box-shadow:0 24px 48px rgba(0,0,0,0.3)}
.dl-card .card-screenshot{width:100%;border-radius:16px;overflow:hidden;margin-bottom:clamp(16px,2.5vw,20px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.dl-card .card-screenshot img{width:100%;display:block}
.dl-card .card-icon-big{width:clamp(76px,10vw,96px);aspect-ratio:1;border-radius:22px;margin:0 auto clamp(16px,2.5vw,20px);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(139,92,246,0.3)}
.dl-card .card-icon-big svg{width:clamp(38px,5vw,48px);height:clamp(38px,5vw,48px);fill:#fff}
.dl-card h3{font-size:clamp(16px,2.2vw,18px);font-weight:700;color:var(--ink);margin-bottom:4px;text-align:center;letter-spacing:-0.01em}
.dl-card .meta{font-size:clamp(13px,1.8vw,14px);color:var(--ink3);text-align:center;margin-bottom:clamp(16px,2.5vw,20px)}
.dl-card .dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:clamp(14px,2vw,16px) clamp(24px,3vw,32px);border-radius:14px;font-size:clamp(15px,2vw,16px);font-weight:600;color:#fff;transition:all .3s;cursor:pointer}
.dl-card .dl-btn:hover{transform:translateY(-2px);filter:brightness(1.15)}
.dl-card .dl-btn svg{width:20px;height:20px;flex-shrink:0;fill:currentColor}
.dl-card .dl-note{margin-top:14px;font-size:clamp(12px,1.6vw,13px);color:var(--ink4);text-align:center}
.dl-card .dl-note a{color:var(--ink3);font-weight:600;cursor:pointer;transition:color .2s}
.dl-card .dl-note a:hover{color:var(--brand)}

.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{background:var(--bg2);border:1px solid var(--line2);border-radius:24px;padding:clamp(28px,5vw,40px);text-align:center;max-width:340px;width:100%;box-shadow:0 32px 80px rgba(0,0,0,0.5);animation:slideUp .35s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qr-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px}
.qr-box .qr-hint{font-size:14px;color:var(--ink3);margin-bottom:24px}
.qr-box .qr-img{width:min(220px,65vw);margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line2)}
.qr-box .qr-img img{width:100%;display:block}
.qr-box .qr-tip{margin-top:18px;font-size:13px;color:var(--brand);font-weight:600}
.qr-box .qr-close{margin-top:24px;padding:12px 28px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:all .2s}
.qr-box .qr-close:hover{background:var(--surface2);border-color:var(--ink4)}

@media(max-width:640px){.hub-grid{grid-template-columns:1fr;max-width:420px}}
</style>
</head>
