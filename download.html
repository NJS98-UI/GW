*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:var(--ink-2);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

nav .inner{display:flex;align-items:center;justify-content:space-between;height:clamp(50px, 7vh, 58px);gap:12px}

nav .links{display:flex;align-items:center;gap:clamp(14px, 2.6vw, 28px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none;padding:4px 0}
nav .links::-webkit-scrollbar{display:none}
nav .links a{font-size:clamp(11.5px, 2.4vw, 13px);color:var(--ink-3);font-weight:500;transition:color .2s;white-space:nowrap;flex-shrink:0;cursor:pointer}
nav .links a:hover{color:var(--ink-2)}
nav .links a.active{color:var(--brand);font-weight:600}

.page-head{text-align:center;padding:clamp(40px, 7vw, 64px) 0 clamp(24px, 4vw, 36px);background:linear-gradient(180deg,#f4f6fe 0%,#ebefff 25%,#ffffff 60%)}

.dl-card{

.dl-card .card-screenshot{width:100%;border-radius:12px;overflow:hidden;margin-bottom:clamp(14px, 2vw, 18px);border:1px solid var(--line);box-shadow:0 4px 16px rgba(15,23,42,0.06)}
.dl-card .card-screenshot img{width:100%;display:block}
.dl-card .card-icon-big{width:clamp(72px, 10vw, 96px);aspect-ratio:1;border-radius:20px;margin:0 auto clamp(14px, 2vw, 18px);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(139,92,246,0.25)}
.dl-card .card-icon-big svg{width:clamp(36px, 5vw, 48px);height:clamp(36px, 5vw, 48px);fill:#fff}
.dl-card h3{font-size:clamp(15px, 2.2vw, 17px);font-weight:800;color:var(--ink);margin-bottom:4px;text-align:center}
.dl-card .meta{font-size:clamp(12px, 1.7vw, 13px);color:var(--ink-3);text-align:center;margin-bottom:clamp(14px, 2vw, 18px)}
.dl-card .dl-btn{

  border-radius:12px;font-size:clamp(14px, 2vw, 15px);font-weight:700;
  color:#fff;transition:all .25s;
}
.dl-card .dl-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.dl-card .dl-btn svg{width:20px;height:20px;flex-shrink:0}
.dl-card .dl-note{margin-top:12px;font-size:clamp(11px, 1.6vw, 12px);color:var(--ink-4);text-align:center}
.dl-card .dl-note a{color:var(--ink-3);font-weight:600;cursor:pointer}

/* QR Modal */
.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(15,23,42,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{background:#fff;border-radius:20px;padding:clamp(24px, 4vw, 36px);text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(15,23,42,0.2);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qr-title{font-size:clamp(16px, 2.4vw, 18px);font-weight:700;color:var(--ink);margin-bottom:4px}
.qr-box .qr-hint{font-size:clamp(13px, 1.9vw, 14px);color:var(--ink-3);margin-bottom:clamp(16px, 2.5vw, 22px)}
.qr-box .qr-img{width:min(200px, 60vw);margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.qr-box .qr-img img{width:100%;display:block}
.qr-box .qr-tip{margin-top:clamp(14px, 2vw, 18px);font-size:clamp(12px, 1.8vw, 13px);color:var(--brand);font-weight:600}
.qr-box .qr-close{margin-top:clamp(16px, 2.5vw, 22px);padding:10px 24px;background:var(--brand-bg);border:none;border-radius:10px;font-size:14px;font-weight:600;color:var(--brand);cursor:pointer;transition:all .2s}
.qr-box .qr-close:hover{background:var(--brand);color:#fff}

@media(max-width:640px){.hub-grid{grid-template-columns:1fr;max-width:420px}}
</style>
</head>
