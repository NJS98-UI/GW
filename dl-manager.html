<style>
:root{--bg:#fff;--bg-alt:#f8fafc;--ink:#0a1628;--ink-2:#1e293b;--ink-3:#5b6c8a;--ink-4:#94a3b8;--brand:#4f46e5;--brand-bg:#eef2ff;--line:rgba(226,232,240,0.6);--radius:16px;--container:min(1060px,100%)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:var(--ink-2);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--brand);text-decoration:none}
.container{max-width:var(--container);margin:0 auto;padding:0 clamp(16px,4vw,24px);width:100%}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.72);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5)}
nav .inner{display:flex;align-items:center;justify-content:space-between;height:clamp(50px,7vh,58px);gap:12px}
nav .logo{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;flex-shrink:0}
nav .logo .mark{width:clamp(24px,3.2vw,28px);height:clamp(24px,3.2vw,28px);border-radius:7px;background:linear-gradient(135deg,#6366f1,#2563eb);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(79,70,229,0.3)}
nav .logo .mark svg{width:13px;height:13px;fill:#fff}
nav .links{display:flex;align-items:center;gap:clamp(14px,2.6vw,28px);overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-ms-overflow-style:none;padding:4px 0}

.detail{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(24px,4vw,40px) clamp(16px,4vw,24px) clamp(32px,5vw,48px)}

.detail .dl-btn:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(79,70,229,0.4);color:#fff}
.detail .dl-btn svg{width:20px;height:20px;flex-shrink:0}
.detail .dl-note{margin-top:18px;font-size:clamp(12px,1.8vw,13px);color:var(--ink-4);text-align:center}
.detail .dl-note a{color:var(--ink-3);font-weight:600;cursor:pointer}
.detail .dl-note a:hover{color:var(--brand)}
.back{text-align:center;padding-bottom:clamp(24px,4vw,36px)}
.back a{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:10px;background:var(--bg-alt);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-3);transition:all .2s}
.back a:hover{border-color:var(--brand);color:var(--brand)}
.back a svg{width:16px;height:16px}

.qr-modal{display:none;position:fixed;inset:0;z-index:999;background:rgba(15,23,42,0.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.qr-box{background:#fff;border-radius:20px;padding:clamp(24px,4vw,36px);text-align:center;max-width:320px;width:100%;box-shadow:0 20px 60px rgba(15,23,42,0.2);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.qr-box .qr-title{font-size:clamp(16px,2.4vw,18px);font-weight:700;color:var(--ink);margin-bottom:4px}
.qr-box .qr-hint{font-size:clamp(13px,1.9vw,14px);color:var(--ink-3);margin-bottom:clamp(16px,2.5vw,22px)}
.qr-box .qr-img{width:min(200px,60vw);margin:0 auto;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.qr-box .qr-img img{width:100%;display:block}
.qr-box .qr-tip{margin-top:clamp(14px,2vw,18px);font-size:clamp(12px,1.8vw,13px);color:var(--brand);font-weight:600}
.qr-box .qr-close{margin-top:clamp(16px,2.5vw,22px);padding:10px 24px;background:var(--brand-bg);border:none;border-radius:10px;font-size:14px;font-weight:600;color:var(--brand);cursor:pointer;transition:all .2s}
.qr-box .qr-close:hover{background:var(--brand);color:#fff}

footer{border-top:1px solid var(--line);background:var(--bg-alt);padding:clamp(20px,3vw,28px) clamp(16px,4vw,24px);margin-top:auto}
footer .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
footer .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(13px,2vw,14px);color:var(--ink);white-space:nowrap}

footer .links{display:flex;gap:clamp(16px,2.4vw,22px);flex-wrap:wrap}
footer .links a{font-size:clamp(12px,1.8vw,12.5px);color:var(--ink-4);transition:color .2s;cursor:pointer}
footer .links a:hover{color:var(--brand)}
